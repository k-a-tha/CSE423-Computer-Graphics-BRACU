<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1024"/>
      <stop offset="0.55" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#2a1250"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity="0"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- perspective floor grid -->
  <g stroke="url(#floor)" stroke-width="1" fill="none">
    <path d="M640 170 L-400 320 M640 170 L-100 320 M640 170 L200 320 M640 170 L420 320 M640 170 L640 320 M640 170 L860 320 M640 170 L1080 320 M640 170 L1380 320 M640 170 L1680 320"/>
    <path d="M0 200 H1280 M0 226 H1280 M0 258 H1280 M0 296 H1280" stroke-opacity="0.7"/>
  </g>
  <rect y="170" width="1280" height="150" fill="#0d1024" opacity="0.25"/>

  <!-- stars / points -->
  <g fill="#ffffff">
    <circle cx="90" cy="40" r="1.6" opacity="0.7"/><circle cx="210" cy="95" r="1.2" opacity="0.5"/>
    <circle cx="330" cy="30" r="1.4" opacity="0.6"/><circle cx="1180" cy="50" r="1.6" opacity="0.7"/>
    <circle cx="1040" cy="28" r="1.2" opacity="0.5"/><circle cx="1230" cy="130" r="1.3" opacity="0.5"/>
    <circle cx="860" cy="60" r="1" opacity="0.4"/><circle cx="470" cy="75" r="1" opacity="0.4"/>
  </g>
  <g>
    <rect x="150" y="150" width="7" height="7" fill="#5eead4"/>
    <rect x="1050" y="250" width="7" height="7" fill="#f472b6"/>
    <rect x="1240" y="265" width="6" height="6" fill="#facc15"/>
    <rect x="250" y="235" width="6" height="6" fill="#a78bfa"/>
  </g>

  <!-- wireframe cube (right) -->
  <g transform="translate(1165 160)" fill="none" stroke-linejoin="round">
    <path d="M-52 -18 L0 -48 L52 -18 L0 12 Z" fill="#facc15" fill-opacity="0.95" stroke="#6b5200" stroke-width="2"/>
    <path d="M-52 -18 L0 12 L0 72 L-52 42 Z" fill="#eab308" fill-opacity="0.95" stroke="#6b5200" stroke-width="2"/>
    <path d="M52 -18 L0 12 L0 72 L52 42 Z" fill="#ca8a04" fill-opacity="0.95" stroke="#6b5200" stroke-width="2"/>
  </g>

  <!-- spike + diamond (left) -->
  <g transform="translate(105 225)">
    <path d="M-34 40 L0 -40 L34 40 Z" fill="#33332a" stroke="#9a9a8c" stroke-width="2"/>
    <path d="M0 -40 L-12 40 M0 -40 L12 40" stroke="#9a9a8c" stroke-width="1.5"/>
  </g>
  <path d="M110 62 L128 80 L110 98 L92 80 Z" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>

  <!-- title -->
  <text x="640" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="50" font-weight="700" fill="url(#title)" letter-spacing="1">Computer Graphics · OpenGL</text>
  <text x="640" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="19" fill="#c4c0e8" letter-spacing="2">FROM PIXELS TO 3D WORLDS  —  PYTHON · PYOPENGL · GLUT</text>
</svg>
